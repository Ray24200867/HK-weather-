<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市區與離岸島嶼及山頂的夏季平均風速</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* ===== 插入網頁時：複製下面 #wind-chart 開頭的樣式即可（body / .wrap 只供單獨預覽） ===== */
  body { margin: 0; background: #fff; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0; }
  #wind-chart { margin: 0; font-family: "Source Sans 3", "Noto Sans TC", Arial, sans-serif; color: #16293F; }
  #wind-chart .chart-title { margin: 0; font: 700 18px/1.3 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; text-align: left; }
  #wind-chart .chart-chatter { margin: 2px 0 5px; font: 400 15px/1.4 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; color: #5B6573; text-align: left; }
  #wind-chart .chart-source { margin: 4px 0 0; font: 400 13px/1.4 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; color: #5B6573; }
  @media (max-width: 640px) {
    #wind-chart .chart-title { font-size: 17px; }
    #wind-chart .chart-chatter { font-size: 14px; }
    #wind-chart .chart-source { font-size: 12px; }
  }
  #wind-chart svg { display: block; width: 100%; height: auto; }
  #wind-chart .wd-pole { stroke: #16293F; stroke-width: 3; stroke-linecap: round; }
  #wind-chart .wd-ring { fill: #fff; stroke: #16293F; stroke-width: 2; }
  #wind-chart .wd-sock { fill: #C4502A; stroke: #C4502A; stroke-width: 1; stroke-linejoin: round; }
  #wind-chart .wd-sock-w { fill: #fff; }
  #wind-chart .wd-streak { stroke: #B5BAC1; stroke-width: 2; stroke-linecap: round; opacity: .6; }
  #wind-chart .wd-labels { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 5px; }
  #wind-chart .wd-labels p { margin: 0; padding-left: 8%; font: 400 12px/1.2 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; color: #16293F; }
  #wind-chart .wd-labels b { font: 700 23px/1 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; }
  #wind-chart .wd-labels em { display: block; margin-top: 2px; font: 700 12px/1.15 "Source Sans 3", "Noto Sans TC", Arial, sans-serif; font-style: normal; color: #C4502A; }
  #wind-chart .wd-labels p:last-child em { color: #5B6573; }
  #wind-chart .wd-labels span { display: block; margin-top: 2px; font-size: 12px; color: #5B6573; }
  @media (max-width: 640px) { #wind-chart .wd-labels b { font-size: 26px; } }

  #wind-chart .chart-title { font-size: 18px; }
  #wind-chart .wd-labels p, #wind-chart .wd-labels em,
  #wind-chart .wd-labels span { font-size: 15px; }
  @media (max-width: 640px) {
    #wind-chart .chart-title { font-size: 17px; }
    #wind-chart .wd-labels p, #wind-chart .wd-labels em,
    #wind-chart .wd-labels span { font-size: 14px; }
  }
  #wind-chart .chart-title { line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
<!-- ===== 圖表 HTML：從這裡開始複製 ===== -->
<figure class="wind-chart" id="wind-chart">
    <p class="chart-title">市區與離岸島嶼及山頂的夏季平均風速</p>
    <p class="chart-chatter">2016–2025 年 6 至 8 月</p>
    <svg role="img" aria-label="兩個風向袋：2016 至 2025 年 6 至 8 月，市區 7 個氣象站平均風速每小時 8.2 公里，屬 2 級輕風，風向袋大部分垂下；離岸島嶼及山頂 6 個氣象站平均每小時 19.8 公里，屬 3 級微風，風向袋差不多吹直。"></svg>
    <div class="wd-labels">
      <p><b>8.2</b> km/h<em>2級 輕風</em><span>市區（7 站平均）</span></p>
      <p><b>19.8</b> km/h<em>3級 微風</em><span>離岸島嶼及山頂（6 站平均）</span></p>
    </div>
    <figcaption class="chart-source">來源：香港天文台 · 風向袋按風速繪製，約 28 km/h 完全吹直；天文台風速於離地約 10 米測量，街道上通常更弱 · 製圖：於夏涵</figcaption>
  </figure>
<!-- ===== 圖表 HTML：到這裡結束 ===== -->
</div>
<!-- ===== 圖表程式：放在上面 HTML 之後 ===== -->
<script>
/* 風向袋：市區 vs 離岸島嶼及山頂的夏季平均風速（各組氣象站平均）
   按機場風向袋慣例：5 節，每節約 3 海里／小時（≈5.6 km/h），約 28 km/h 完全吹直
   每個袋的形狀由真實風速決定；背景風線的流速也和風速成正比
   數據：香港天文台各站每日平均風速，2016–2025 年 6–8 月平均 → data/hko-summer-wind-2016-2025.csv */
(() => {
  const fig = document.querySelector("#wind-chart")
  if (!fig) return
  const svg = fig.querySelector("svg")
  const NS = "http://www.w3.org/2000/svg"
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches

  const SITES = [
    { speed: 8.2 },     // 市區 7 站平均：將軍澳、黃竹坑、沙田、屯門、京士柏、啟德、北角
    { speed: 19.8 },     // 離岸島嶼及山頂 6 站平均：沙洲、長洲、青洲、大老山、橫瀾島、大帽山
  ]
  const FULL = 28, SEGS = 5, SEG_LEN = 30
  const PANEL = 320, H = 180
  const POLE_X = 56, POLE_TOP = 30, GROUND = 165
  const D = [36, 32, 28, 24, 20]   // 每節由袋口至袋尾逐漸收窄
  svg.setAttribute("viewBox", `0 0 ${PANEL * SITES.length} ${H}`)

  const el = (tag, attrs, parent = svg) => {
    const n = document.createElementNS(NS, tag)
    for (const k in attrs) n.setAttribute(k, attrs[k])
    parent.appendChild(n)
    return n
  }

  // 每個面板：背景風線、旗桿、五節袋身
  SITES.forEach((s, i) => {
    const g = el("g", { transform: `translate(${i * PANEL} 0)` })
    const clip = el("clipPath", { id: `wd-clip-${i}` }, g)
    el("rect", { x: 0, y: 0, width: PANEL, height: H }, clip)
    const streaks = el("g", { "clip-path": `url(#wd-clip-${i})` }, g)
    s.streaks = Array.from({ length: 9 }, (_, k) => ({
      y: 26 + k * 16 + (k % 2) * 5,
      x: ((k * 97) % PANEL),
      len: 26 + (k * 13) % 30,
      node: el("line", { class: "wd-streak" }, streaks),
    }))
    el("line", { x1: POLE_X, y1: POLE_TOP - 6, x2: POLE_X, y2: GROUND, class: "wd-pole" }, g)
    el("line", { x1: POLE_X - 22, y1: GROUND, x2: POLE_X + 22, y2: GROUND, class: "wd-pole" }, g)
    s.segs = D.map((_, k) => el("path", { class: k % 2 ? "wd-sock wd-sock-w" : "wd-sock" }, g))
    el("circle", { cx: POLE_X, cy: POLE_TOP, r: 4, class: "wd-ring" }, g)
  })

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
  const smooth = (t) => t * t * (3 - 2 * t)

  // speed：目前畫出的風速（入場時由 0 升到實際值）；t：時間，用來輕微擺動
  function drawSock(s, speed, t) {
    const n = (speed / FULL) * SEGS   // 吹脹了幾節
    let px = POLE_X, py = POLE_TOP
    const pts = [[px, py]], angs = [], fills = []
    for (let k = 0; k < SEGS; k++) {
      const f = smooth(clamp((n - k) / 2.4 + 0.35, 0, 1))   // 這一節吹脹的程度（沒吹脹的節逐漸垂下）
      // 角度由垂直向下（0）到水平向右（90°）；吹脹的節隨風輕擺，垂下的節輕輕搖
      const sway = reduced ? 0 : (f > 0.2 ? 3.5 * f : 2.5) * Math.sin(t * (1.2 + speed / 8) + k * 0.9)
      const a = ((90 * f + sway) * Math.PI) / 180
      px += Math.sin(a) * SEG_LEN * (0.75 + 0.25 * f)
      py += Math.cos(a) * SEG_LEN * (0.75 + 0.25 * f)
      pts.push([px, py]); angs.push(a); fills.push(f)
    }
    for (let k = 0; k < SEGS; k++) {
      const [x0, y0] = pts[k], [x1, y1] = pts[k + 1]
      const a = angs[k]
      const w0 = (D[k] * (0.45 + 0.55 * fills[k])) / 2
      const w1 = ((D[k + 1] || D[k] - 4) * (0.45 + 0.55 * fills[k])) / 2
      const nx = Math.cos(a), ny = -Math.sin(a)   // 袋身的法線方向
      s.segs[k].setAttribute("d",
        `M${x0 + nx * w0},${y0 + ny * w0} L${x1 + nx * w1},${y1 + ny * w1} ` +
        `L${x1 - nx * w1},${y1 - ny * w1} L${x0 - nx * w0},${y0 - ny * w0} Z`)
    }
  }

  function drawStreaks(s, speed, dt) {
    s.streaks.forEach((st) => {
      st.x += speed * 3.2 * dt   // 風愈大，風線流得愈快
      if (st.x > PANEL + 10) st.x = -st.len
      st.node.setAttribute("x1", st.x); st.node.setAttribute("x2", st.x + st.len)
      st.node.setAttribute("y1", st.y); st.node.setAttribute("y2", st.y)
    })
  }

  let raf = 0, running = false, start = null, last = 0
  function frame(now) {
    // 用同一個 requestAnimationFrame 時鐘計時，避免 iframe 的時鐘原點不同。
    if (start === null) start = now
    const t = now / 1000, dt = last ? Math.min(0.05, (now - last) / 1000) : 0
    last = now
    const rise = smooth(clamp((now - start) / 1800, 0, 1))
    SITES.forEach((s) => { drawSock(s, s.speed * rise, t); drawStreaks(s, s.speed, dt) })
    if (running) raf = requestAnimationFrame(frame)
  }

  if (reduced) {
    SITES.forEach((s) => { drawSock(s, s.speed, 0); drawStreaks(s, 0, 0) })
    return
  }
  // 靜止畫面也應按實際風速呈現，避免圖表尚未進入畫面時兩個袋都垂下。
  SITES.forEach((s) => drawSock(s, s.speed, 0))
  // 進入畫面後，風向袋按各自風速吹起並持續輕擺。
  new IntersectionObserver((entries) => {
    const on = entries.some((e) => e.isIntersecting)
    if (on && !running) {
      running = true; last = 0; start = null
      raf = requestAnimationFrame(frame)
    } else if (!on && running) { running = false; cancelAnimationFrame(raf) }
  }, { threshold: 0.1 }).observe(fig)
})()

</script>
</body>
</html>
